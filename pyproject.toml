[project]
name = "vlink"
version = "0.1.0"
description = "Certified Gromov link condition for piecewise Euclidean triangulated 3-manifolds"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Asem Wardak" }]
# vlink itself is pure Python (its kernel decodes isosigs itself, vlink/tri.py)
requires-python = ">=3.10,<3.15"
dependencies = []

[dependency-groups]
# tests and validation: numpy (verify_cert.py, the independent float checker) and
# Regina (cross-checks; PyPI wheels: CPython 3.9-3.14, Linux x86_64 and macOS only)
test = ["numpy>=1.26", "regina>=7.4.1; sys_platform != 'win32'"]
# the legacy code path (gallery.py) uses tqdm for progress bars
legacy = ["tqdm>=4.66"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["vlink"]

[tool.uv]
default-groups = ["test"]
