[project]
name = "vlink"
version = "0.1.0"
description = "Certified Gromov link condition for piecewise Euclidean triangulated 3-manifolds"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Asem Wardak" }]
# regina's PyPI wheels: CPython 3.9-3.14, Linux x86_64 and macOS (no Windows)
requires-python = ">=3.10,<3.15"
dependencies = ["regina>=7.4.1"]

[dependency-groups]
# validation/verify_cert.py (independent float witness checker) uses numpy
test = ["numpy>=1.26"]
# the legacy code path (gallery.py) uses tqdm for progress bars
legacy = ["tqdm>=4.66"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["vlink"]

[tool.uv]
default-groups = ["test"]
